# balatro-advisor live state: writes <profile>/live.jkr whenever the run changes,
# and <profile>/live.beat every 2 s so the advisor knows the game is running.
#
# Lovely-only (no Steamodded): it reuses the game's own save_run() serialisation and
# changes nothing else. Vanilla only turns achievements off through G.F_NO_ACHIEVEMENTS,
# which this never touches (Steamodded is what normally sets it).

[manifest]
version = "1.0.0"
dump_lua = false
priority = 0

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "function Game:update(dt)"
position = "after"
match_indent = true
payload = '''
ADVISOR_BEAT_T = (ADVISOR_BEAT_T or 99) + dt
if ADVISOR_BEAT_T > 2 and G and G.SETTINGS and G.SETTINGS.profile then
    ADVISOR_BEAT_T = 0
    pcall(love.filesystem.write, G.SETTINGS.profile .. '/live.beat', tostring(G.STAGE))
end
if G and G.STAGE == G.STAGES.RUN and G.GAME and G.GAME.blind and G.jokers and G.SETTINGS then
    ADVISOR_LIVE_T = (ADVISOR_LIVE_T or 0) + dt
    -- Only settled moments: a screen that waits for the player, the state change done,
    -- and no animations queued (mid-play states show cards in flight and no score yet).
    local s = G.STATES
    local waiting = G.STATE == s.SELECTING_HAND or G.STATE == s.SHOP or G.STATE == s.BLIND_SELECT
        or G.STATE == s.ROUND_EVAL or G.STATE == s.TAROT_PACK or G.STATE == s.PLANET_PACK
        or G.STATE == s.SPECTRAL_PACK or G.STATE == s.STANDARD_PACK or G.STATE == s.BUFFOON_PACK
    -- Some jokers keep cosmetic events queued forever, so only blocking ones count.
    local idle = G.STATE_COMPLETE and G.E_MANAGER and G.E_MANAGER.queues and true
    if idle then
        for _, ev in ipairs(G.E_MANAGER.queues.base or {}) do
            if ev.blocking then idle = false break end
        end
    end
    if ADVISOR_LIVE_T > 0.5 and waiting and idle then
        ADVISOR_LIVE_T = 0
        pcall(function()
            local cardAreas = {}
            for k, v in pairs(G) do
                if (type(v) == "table") and v.is and v:is(CardArea) then
                    local s = v:save()
                    if s then cardAreas[k] = s end
                end
            end
            local tags = {}
            for k, v in ipairs(G.GAME.tags or {}) do
                if (type(v) == "table") and v.is and v:is(Tag) then
                    local s = v:save()
                    if s then tags[k] = s end
                end
            end
            local str = STR_PACK(recursive_table_cull{
                cardAreas = cardAreas, tags = tags, GAME = G.GAME, STATE = G.STATE,
                ACTION = G.action or nil, BLIND = G.GAME.blind:save(),
                BACK = G.GAME.selected_back:save(), VERSION = G.VERSION,
            })
            if str ~= ADVISOR_LIVE_LAST then
                ADVISOR_LIVE_LAST = str
                love.filesystem.write(G.SETTINGS.profile .. '/live.jkr', love.data.compress('string', 'deflate', str, 1))
            end
        end)
    end
end
'''
