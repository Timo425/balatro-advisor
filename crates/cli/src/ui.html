<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balatro Advisor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='1' width='12' height='14' rx='2' fill='%23e8c547'/></svg>">
<style>
  :root {
    --bg: #11201d; --panel: #1a2e2a; --panel2: #213833; --line: #2f4a44;
    --text: #e9f0ee; --muted: #93aba5; --chips: #3b9cff;
    --good: #37d17a; --warn: #f2b33d; --bad: #ff5c5c; --gold: #e8c547;
    --common: #5fa8ff; --uncommon: #3fce8f; --rare: #ff6b6b; --legendary: #b57bff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 14px; align-items: center; padding: 7px 14px; background: #0c1715; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header .title { font-weight: 800; color: var(--gold); letter-spacing: .5px; }
  header .chip { color: var(--muted); } header .chip b { color: var(--text); }
  .status { margin-left: auto; color: var(--muted); display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .dot.busy { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3 } }
  .caveat { color: #f5dc9b; font-size: 12px; cursor: help; }
  main { padding: 10px 14px 12px; display: grid; gap: 10px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); font-weight: 700; }
  h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
  .rounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .round { background: var(--panel2); border-radius: 8px; padding: 8px 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; }
  .round .pct { grid-row: span 2; font-size: 30px; font-weight: 800; min-width: 80px; }
  .round .name { font-weight: 700; } .round .sub { color: var(--muted); font-size: 12px; }
  .round .bar { grid-column: 1 / -1; margin-top: 4px; }
  .bar { height: 6px; background: #0e1b18; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; }
  .cols { display: grid; grid-template-columns: minmax(320px, 5fr) 7fr; gap: 10px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .stack { display: grid; gap: 10px; min-width: 0; }
  .jokers { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 8px; }
  .joker { background: var(--panel2); border-radius: 8px; padding: 8px; border-top: 3px solid var(--common); position: relative; }
  .joker .slot { position: absolute; top: 5px; right: 7px; color: var(--muted); font-size: 11px; }
  .joker .jn { font-weight: 700; padding-right: 14px; }
  .joker .big { font-size: 20px; font-weight: 800; margin-top: 3px; }
  .lbl { font-size: 11px; color: var(--muted); }
  .tags { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 10px; padding: 0 6px; border-radius: 99px; background: #0e1b18; color: var(--muted); border: 1px solid var(--line); }
  .tag.ed { color: #fff; border: none; background: linear-gradient(90deg, #ff6b6b, #f2b33d, #37d17a, #3b9cff, #b57bff); }
  .tag.foil { background: #4a6f9a; color: #fff; border: none; } .tag.holo { background: #b04a6a; color: #fff; border: none; }
  .tag.neg { background: #333; color: #ddd; }
  .order { margin-top: 8px; padding: 6px 9px; border-radius: 6px; background: #0e1b18; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 4px 6px; border-bottom: 1px solid #243d37; vertical-align: middle; white-space: nowrap; }
  td.name { white-space: normal; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
  .star { color: var(--gold); font-weight: 700; }
  .rar-Common { color: var(--common); } .rar-Uncommon { color: var(--uncommon); } .rar-Rare { color: var(--rare); } .rar-Legendary { color: var(--legendary); }
  .play { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .card { background: #f4efe4; color: #222; border-radius: 5px; padding: 3px 7px; font-weight: 700; }
  .muted { color: var(--muted); }
  .mix td { padding: 2px 6px; border: none; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details summary b { color: var(--text); }
  footer { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  [title] { cursor: help; }
</style>
</head>
<body>
<header>
  <span class="title">BALATRO ADVISOR</span>
  <span class="chip" id="h-deck"></span>
  <span class="chip" id="h-ante"></span>
  <span class="chip" id="h-money"></span>
  <span class="chip" id="h-screen"></span>
  <span class="caveat" id="h-caveat"></span>
  <span class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
</header>
<main id="main"><div class="empty">Waiting for the first analysis…</div></main>

<script>
const $ = (s) => document.querySelector(s);
const pct = (x) => (x * 100).toFixed(x > 0 && x < 0.1 ? 1 : 0) + "%";
const pp = (d) => Math.abs(d) < 0.005 ? '<span class="flat">±0</span>'
  : `<span class="${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${Math.round(d * 100)}</span>`;
const gainTxt = (g) => Math.abs(g) < 0.005 ? '<span class="flat">±0%</span>'
  : `<span class="${g > 0 ? "up" : "down"}">${g > 0 ? "+" : ""}${Math.round(g * 100)}%</span>`;
const color = (p) => p >= 0.85 ? "var(--good)" : p >= 0.5 ? "var(--warn)" : "var(--bad)";
const num = (x) => x >= 1e6 ? x.toExponential(2) : Math.round(x).toLocaleString("en-US");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rarColor = { Common: "var(--common)", Uncommon: "var(--uncommon)", Rare: "var(--rare)", Legendary: "var(--legendary)" };
const edTag = (e) => !e ? "" : e === "polychrome" ? '<span class="tag ed">poly</span>' : e === "foil" ? '<span class="tag foil">foil</span>' : e === "holo" ? '<span class="tag holo">holo</span>' : '<span class="tag neg">negative</span>';
const roundName = (r) => r.label === "Boss" ? r.blind : r.label.replace("Next: ", "");
const nowRounds = (a) => a.rounds.filter((r) => !r.horizon);
const STAKES = ["", "White", "Red", "Green", "Black", "Blue", "Purple", "Orange", "Gold"];

function candTable(a, list, withFind) {
  return `<table><tr><th>Joker</th><th>Action</th><th class="num">$</th>${a.rounds.map((r) => `<th class="num" ${r.horizon ? 'title="Share of that boss target reached (win chance is ~0 this far out)"' : ""}>${esc(r.horizon ? r.label + " reach" : roundName(r))}</th>`).join("")}<th class="num" title="Change in the best hand you can make from a fresh deal">Hand</th>${withFind ? '<th class="num" title="Chance a given shop shows it, before rerolls">Shop</th>' : ""}</tr>` +
    list.map((c) => `<tr>
      <td class="name" ${c.note ? `title="${esc(c.note)}"` : ""}><span class="rar-${c.rarity}">●</span> <b>${esc(c.name)}</b> ${edTag(c.edition)}${c.missing_gold ? ' <span class="star" title="No Gold sticker yet">★</span>' : ""}</td>
      <td class="muted">${esc(c.action.replace("replace ", "→ "))}</td>
      <td class="num">${c.cost}</td>
      ${c.p_win.map((p, i) => { if (a.rounds[i].horizon) { const r = Math.min(c.reach[i], 9), was = Math.min(c.reach[i] - c.reach_delta[i], 9);
          return `<td class="num" title="Share of the ${esc(a.rounds[i].label)} boss target you reach on average: now ${pct(was)}, with it ${pct(r)}"><span class="muted">${pct(was).replace("%", "")}→</span><span class="${c.reach_delta[i] > 0.005 ? "up" : c.reach_delta[i] < -0.005 ? "down" : "flat"}">${pct(r)}</span></td>`; }
        const was = p - c.p_win_delta[i], d = c.p_win_delta[i];
        const cls = Math.abs(d) < 0.005 ? "flat" : d > 0 ? "up" : "down";
        return `<td class="num" title="now ${pct(was)}, with it ${pct(p)}"><span class="muted">${pct(was).replace("%", "")}→</span><span class="${cls}">${pct(p)}</span></td>`; }).join("")}
      <td class="num">${gainTxt(c.score_gain)}</td>
      ${withFind ? `<td class="num muted">${c.per_shop != null ? pct(c.per_shop) : ""}</td>` : ""}
    </tr>`).join("") + `</table>`;
}

function render(d) {
  if (d.status === "no_run") {
    $("#main").innerHTML = `<section><div class="empty">No run in progress (${esc(d.message)}).<br>Start or continue a run and this updates by itself.</div></section>` + goldSection(d.gold);
    return;
  }
  if (d.status !== "ok") return;
  const a = d.analysis;
  $("#h-deck").innerHTML = `<b>${esc(a.deck)}</b>`;
  $("#h-ante").innerHTML = `Ante <b>${a.ante}</b> · <b>${STAKES[a.stake] || a.stake}</b>`;
  $("#h-money").innerHTML = `<b>$${a.dollars}</b>`;
  $("#h-screen").innerHTML = esc(a.screen.replace(/([a-z])([A-Z])/g, "$1 $2"));
  $("#h-caveat").innerHTML = a.live ? '<span style="color:var(--good)">● live</span>' : a.caveats.length ? "⚠ snapshot" : "";
  $("#h-caveat").title = a.caveats.join("\n");

  let html = `<section style="padding:8px"><div class="rounds">` + nowRounds(a).map((r) => `
    <div class="round" ${r.unmodelled ? `title="${esc(r.unmodelled)}"` : ""}>
      <div class="pct" style="color:${color(r.p_win)}">${pct(r.p_win)}</div>
      <div class="name">${esc(r.label.replace("Next: ", ""))}${r.label === "Boss" ? " · " + esc(r.blind) : ""}${r.unmodelled ? ' <span class="caveat">⚠</span>' : ""}</div>
      <div class="sub">${num(r.target)} chips${r.in_progress ? " · in progress" : ""} · typical ${num(r.total.p50)} (${num(r.total.p10)}–${num(r.total.p90)})</div>
      <div class="bar"><i style="width:${r.p_win * 100}%;background:${color(r.p_win)}"></i></div>
    </div>`).join("") + `</div>` +
    `<div class="lbl" style="margin-top:6px" title="Your current jokers against a plain boss in later antes: how far this board carries without new jokers">Later, with these jokers: ${a.rounds.filter((r) => r.horizon).map((r) => `${esc(r.label)} boss (${num(r.target)}) <b style="color:${color(r.p_win)}">${pct(r.p_win)}</b>`).join(" · ")}</div></section>`;

  // Left: jokers, hand mix, best play
  let left = `<section><h2>Your jokers <small>share of best-hand score · if sold</small></h2>`;
  if (!a.jokers.length) left += `<div class="muted">No jokers yet.</div>`;
  else {
    left += `<div class="jokers">` + a.jokers.map((j, i) => {
      const scoring = j.roles.some((r) => ["scoring", "retrigger", "rule"].includes(r)) || Math.abs(j.score_share) > 0.005;
      const sold = j.p_win_if_removed.map((d, k) => a.rounds[k].horizon ? "" : `${esc(roundName(a.rounds[k]))} ${pp(d)}`).filter(Boolean).join(" · ");
      return `<div class="joker" style="border-top-color:${rarColor[j.rarity] || "var(--line)"}" ${j.note ? `title="${esc(j.note)}"` : ""}>
        <span class="slot">${i + 1}</span>
        <div class="jn">${esc(j.name)}</div>
        <div class="tags">${edTag(j.edition)}${j.roles.map((r) => `<span class="tag">${r}</span>`).join("")}${j.eternal ? '<span class="tag">eternal</span>' : ""}${j.debuff ? '<span class="tag" style="color:var(--bad)">debuffed</span>' : ""}</div>
        ${scoring ? `<div class="big">${Math.round(j.score_share * 100)}%</div>` : `<div class="big muted" title="No direct score">—</div>`}
        <div class="lbl">without it: ${sold}</div>
      </div>`;
    }).join("") + `</div>`;
    if (a.order && !a.order.is_current) {
      left += `<div class="order">Better order: <b>${a.order.order.map(esc).join(" → ")}</b> <span class="up">+${Math.round(a.order.gain * 100)}%</span></div>`;
    } else if (a.order) {
      left += `<div class="order muted"><span class="up">✓</span> Order is already the best found.</div>`;
    }
  }
  if (a.hand_mix && a.hand_mix.length) {
    left += `<div style="margin-top:8px"><div class="lbl" title="From simulated ${esc(roundName(nowRounds(a)[nowRounds(a).length - 1]))} rounds; junk hands played to dig are left out">Hands that score your points</div><table class="mix">` +
      a.hand_mix.slice(0, 4).map((h) => `<tr><td>${esc(h.hand)}</td><td class="num" style="width:44px">${pct(h.share)}</td><td style="width:38%"><div class="bar"><i style="width:${h.share * 100}%;background:var(--chips)"></i></div></td><td class="num muted">avg ${num(h.mean)}</td></tr>`).join("") + `</table></div>`;
  }
  left += `</section>`;
  if (a.best_play) {
    left += `<section><h2>Best play now</h2><div class="play">${a.best_play.cards.map((c) => `<span class="card">${esc(c)}</span>`).join("")}<span style="margin-left:6px"><b>${esc(a.best_play.hand)}</b> · ${num(a.best_play.score)}</span></div></section>`;
  }

  // Right: shop, dig list
  let right = "";
  if (a.shop.length) right += `<section><h2>Shop <small>win chance now → with it</small></h2>${candTable(a, a.shop, false)}</section>`;
  right += `<section><h2>Worth digging for <small>win chance now → with it · still in the shop pool · ★ no Gold sticker${a.gold && a.gold.this_run_counts ? " (this run can earn it)" : ""}</small></h2>${candTable(a, a.rescue.slice(0, 10), true)}</section>`;

  html += `<div class="cols"><div class="stack">${left}</div><div class="stack">${right}</div></div>`;
  html += goldSection(d.gold);
  html += `<footer title="${esc(a.heuristics.join("\n"))}">Heuristic play/discard policy · analysed in ${a.elapsed_ms} ms · save ${a.save_age_secs ?? "?"} s old</footer>`;
  $("#main").innerHTML = html;
}

function goldSection(g) {
  if (!g) return "";
  const byR = {};
  g.missing.forEach((j) => (byR[j.rarity] ||= []).push(j));
  const open = localStorage.getItem("goldOpen") === "1" ? " open" : "";
  return `<section style="padding:7px 12px"><details${open} ontoggle="try{localStorage.setItem('goldOpen', this.open ? '1' : '0')}catch(e){}"><summary>Gold Stake stickers <b>${g.have_gold}/${g.total}</b> · ${g.missing.length} missing${g.tally_in_file != null && g.tally_in_file !== g.tally_computed ? ' · <span class="down">tally mismatch, format may have changed</span>' : ""}</summary>` +
    ["Common", "Uncommon", "Rare", "Legendary"].filter((r) => byR[r]).map((r) =>
      `<div style="margin:4px 0"><span class="rar-${r}"><b>${r}</b></span> <span class="muted">${byR[r].map((j) => esc(j.name)).join(", ")}</span></div>`).join("") +
    `</details></section>`;
}

let version = -1;
async function poll() {
  try {
    const r = await fetch("/api/analysis", { cache: "no-store" });
    const j = await r.json();
    $("#dot").className = "dot" + (j.busy ? " busy" : "");
    $("#status").textContent = j.busy ? "analysing…" : "live";
    if (j.version !== version) { version = j.version; render(j.data); }
  } catch (e) {
    $("#dot").className = "dot busy";
    $("#status").textContent = "advisor not running";
  }
  setTimeout(poll, 800);
}
poll();
</script>
</body>
</html>
