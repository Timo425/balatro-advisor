<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balatro Advisor</title>
<style>
  :root {
    --bg: #11201d; --panel: #1a2e2a; --panel2: #213833; --line: #2f4a44;
    --text: #e9f0ee; --muted: #93aba5; --chips: #3b9cff; --mult: #ff4d4d;
    --good: #37d17a; --warn: #f2b33d; --bad: #ff5c5c; --gold: #e8c547;
    --common: #5fa8ff; --uncommon: #3fce8f; --rare: #ff6b6b; --legendary: #b57bff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: #0c1715ee; backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  header .title { font-weight: 800; letter-spacing: .5px; color: var(--gold); }
  header .chip { color: var(--muted); } header .chip b { color: var(--text); }
  .status { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); }
  .dot.busy { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3 } }
  main { max-width: 1200px; margin: 0 auto; padding: 18px 20px 60px; display: grid; gap: 18px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 700; }
  h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 8px; }
  .caveat { background: #3a2f12; border: 1px solid #6b5520; color: #f5dc9b; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
  .rounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .round { background: var(--panel2); border-radius: 10px; padding: 12px 14px; }
  .round .name { font-weight: 700; } .round .sub { color: var(--muted); font-size: 13px; }
  .round .pct { font-size: 38px; font-weight: 800; margin: 4px 0; }
  .bar { height: 8px; background: #0e1b18; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; }
  .jokers { display: flex; gap: 12px; flex-wrap: wrap; }
  .joker { width: 190px; background: var(--panel2); border-radius: 10px; padding: 12px; border-top: 4px solid var(--common); position: relative; }
  .joker .slot { position: absolute; top: 8px; right: 10px; color: var(--muted); font-size: 12px; }
  .joker .jn { font-weight: 700; padding-right: 20px; }
  .joker .big { font-size: 26px; font-weight: 800; margin-top: 6px; }
  .joker .lbl { font-size: 12px; color: var(--muted); }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #0e1b18; color: var(--muted); border: 1px solid var(--line); }
  .tag.ed { color: #fff; border: none; background: linear-gradient(90deg, #ff6b6b, #f2b33d, #37d17a, #3b9cff, #b57bff); }
  .tag.foil { background: #4a6f9a; color: #fff; border: none; } .tag.holo { background: #b04a6a; color: #fff; border: none; }
  .tag.neg { background: #333; color: #ddd; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .order { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #0e1b18; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid #243d37; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
  .mini { display: inline-block; width: 70px; vertical-align: middle; margin-left: 6px; }
  .star { color: var(--gold); font-weight: 700; }
  .rar-Common { color: var(--common); } .rar-Uncommon { color: var(--uncommon); } .rar-Rare { color: var(--rare); } .rar-Legendary { color: var(--legendary); }
  .play { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .card { background: #f4efe4; color: #222; border-radius: 6px; padding: 6px 9px; font-weight: 700; font-size: 14px; }
  .muted { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  footer { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  .mix td { padding: 5px 8px; }
</style>
</head>
<body>
<header>
  <span class="title">BALATRO ADVISOR</span>
  <span class="chip" id="h-deck"></span>
  <span class="chip" id="h-ante"></span>
  <span class="chip" id="h-money"></span>
  <span class="chip" id="h-screen"></span>
  <span class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
</header>
<main id="main"><div class="empty">Waiting for the first analysis…</div></main>

<script>
const $ = (s) => document.querySelector(s);
const pct = (x) => (x * 100).toFixed(x > 0 && x < 0.1 ? 1 : 0) + "%";
const pp = (d) => {
  const v = Math.round(d * 100);
  if (Math.abs(d) < 0.005) return '<span class="flat">±0</span>';
  return `<span class="${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${v}</span>`;
};
const gainTxt = (g) => {
  if (Math.abs(g) < 0.005) return '<span class="flat">±0%</span>';
  return `<span class="${g > 0 ? "up" : "down"}">${g > 0 ? "+" : ""}${Math.round(g * 100)}%</span>`;
};
const color = (p) => p >= 0.85 ? "var(--good)" : p >= 0.5 ? "var(--warn)" : "var(--bad)";
const num = (x) => x >= 1e6 ? x.toExponential(2) : Math.round(x).toLocaleString("en-US");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rarColor = { Common: "var(--common)", Uncommon: "var(--uncommon)", Rare: "var(--rare)", Legendary: "var(--legendary)" };
const edTag = (e) => !e ? "" : e === "polychrome" ? '<span class="tag ed">polychrome</span>' : e === "foil" ? '<span class="tag foil">foil</span>' : e === "holo" ? '<span class="tag holo">holo</span>' : '<span class="tag neg">negative</span>';

function roundBars(a, ps) {
  return a.rounds.map((r, i) => {
    const p = ps[i] ?? 0;
    return `<div title="${esc(r.label)}: ${pct(p)}"><span class="muted" style="font-size:11px">${esc(r.label === "Boss" ? r.blind : r.label)}</span> <b>${pct(p)}</b><span class="mini bar"><i style="width:${p * 100}%;background:${color(p)}"></i></span></div>`;
  }).join("");
}

function render(d) {
  if (d.status === "no_run") {
    $("#main").innerHTML = `<section><div class="empty">No run in progress (${esc(d.message)}).<br>Start or continue a run and this page updates by itself.</div></section>` + goldSection(d.gold);
    return;
  }
  if (d.status !== "ok") return;
  const a = d.analysis;
  $("#h-deck").innerHTML = `<b>${esc(a.deck)}</b>`;
  $("#h-ante").innerHTML = `Ante <b>${a.ante}</b> · stake <b>${["", "White", "Red", "Green", "Black", "Blue", "Purple", "Orange", "Gold"][a.stake] || a.stake}</b>`;
  $("#h-money").innerHTML = `<b>$${a.dollars}</b>`;
  $("#h-screen").innerHTML = esc(a.screen.replace(/([a-z])([A-Z])/g, "$1 $2"));

  let html = "";
  if (a.caveats.length) html += `<div class="caveat">⚠ ${a.caveats.map(esc).join("<br>")}</div>`;

  // Blinds
  html += `<section><h2>Chance to beat <small>simulated rounds with your deck and jokers</small></h2><div class="rounds">` +
    a.rounds.map((r) => `<div class="round">
      <div class="name">${esc(r.label)} · ${esc(r.blind)}</div>
      <div class="sub">${num(r.target)} chips${r.in_progress ? " · in progress" : ""}</div>
      <div class="pct" style="color:${color(r.p_win)}">${pct(r.p_win)}</div>
      <div class="bar"><i style="width:${r.p_win * 100}%;background:${color(r.p_win)}"></i></div>
      <div class="sub" style="margin-top:6px">typical total ${num(r.total.p50)} (bad luck ${num(r.total.p10)}, good ${num(r.total.p90)})</div>
      ${r.unmodelled ? `<div class="note">${esc(r.unmodelled)}</div>` : ""}
    </div>`).join("") + `</div></section>`;

  // Jokers
  html += `<section><h2>Your jokers <small>left to right · share of your best-hand score each one carries · "if sold" = change in win chance</small></h2>`;
  if (!a.jokers.length) html += `<div class="muted">No jokers yet.</div>`;
  else {
    html += `<div class="jokers">` + a.jokers.map((j, i) => {
      const scoring = j.roles.some((r) => ["scoring", "retrigger", "rule"].includes(r));
      const main = scoring || Math.abs(j.score_share) > 0.005
        ? `<div class="big">${Math.round(j.score_share * 100)}%</div><div class="lbl">of your best-hand score</div>`
        : `<div class="big muted">—</div><div class="lbl">no direct score</div>`;
      const sold = j.p_win_if_removed.map((d, k) => `${esc(a.rounds[k].label === "Boss" ? a.rounds[k].blind : a.rounds[k].label)} ${pp(d)}`).join(" · ");
      return `<div class="joker" style="border-top-color:${rarColor[j.rarity] || "var(--line)"}">
        <span class="slot">${i + 1}</span>
        <div class="jn">${esc(j.name)}</div>
        <div class="tags">${edTag(j.edition)}${j.roles.map((r) => `<span class="tag">${r}</span>`).join("")}${j.eternal ? '<span class="tag">eternal</span>' : ""}${j.debuff ? '<span class="tag" style="color:var(--bad)">debuffed</span>' : ""}</div>
        ${main}
        <div class="note">if sold: ${sold}</div>
        ${j.note ? `<div class="note">${esc(j.note)}</div>` : ""}
      </div>`;
    }).join("") + `</div>`;
    if (a.order) {
      html += a.order.is_current
        ? `<div class="order"><span class="up">✓</span> Order is already the best one found.</div>`
        : `<div class="order">Better order: <b>${a.order.order.map(esc).join(" → ")}</b> <span class="up">(+${Math.round(a.order.gain * 100)}% typical hand)</span></div>`;
    }
  }
  if (a.hand_mix && a.hand_mix.length) {
    html += `<div style="margin-top:14px"><div class="lbl" style="margin-bottom:4px">Which hands score your points (simulated ${esc(a.rounds[a.rounds.length - 1].label === "Boss" ? a.rounds[a.rounds.length - 1].blind : a.rounds[a.rounds.length - 1].label)} rounds; junk hands played to dig left out)</div><table class="mix">` +
      a.hand_mix.slice(0, 6).map((h) => `<tr><td>${esc(h.hand)}</td><td class="num" style="width:120px">${pct(h.share)} <span class="muted">of pts</span></td><td style="width:40%"><div class="bar"><i style="width:${h.share * 100}%;background:var(--chips)"></i></div></td><td class="num muted">${pct(h.played)} of hands · avg ${num(h.mean)}</td></tr>`).join("") + `</table></div>`;
  }
  html += `</section>`;

  // Shop + best play
  const cand = (list, withFind) => `<table><tr><th>Joker</th><th>Action</th><th class="num">Cost</th>${a.rounds.map((r) => `<th class="num">${esc(r.label === "Boss" ? r.blind : r.label)}</th>`).join("")}<th class="num" title="Change in the best hand you can make from a fresh deal">Best hand</th>${withFind ? '<th class="num">Per shop</th>' : ""}</tr>` +
    list.map((c) => `<tr>
      <td><span class="rar-${c.rarity}">●</span> <b>${esc(c.name)}</b> ${edTag(c.edition)} ${c.missing_gold ? '<span class="star" title="No Gold sticker yet">★</span>' : ""}${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}</td>
      <td class="muted">${esc(c.action)}</td>
      <td class="num">$${c.cost}</td>
      ${c.p_win.map((p, i) => `<td class="num">${pct(p)} ${pp(c.p_win_delta[i])}</td>`).join("")}
      <td class="num">${gainTxt(c.score_gain)}</td>
      ${withFind ? `<td class="num muted">${c.per_shop != null ? pct(c.per_shop) : ""}</td>` : ""}
    </tr>`).join("") + `</table>`;

  // Shop and best play only appear when there is something in them
  if (a.shop.length) {
    html += `<section><h2>Shop <small>buy it? chance to win with it, and the change</small></h2>${cand(a.shop, false)}</section>`;
  }
  if (a.best_play) {
    html += `<section><h2>Best play now</h2><div class="play">${a.best_play.cards.map((c) => `<span class="card">${esc(c)}</span>`).join("")}</div><div style="margin-top:8px"><b>${esc(a.best_play.hand)}</b> for <b>${num(a.best_play.score)}</b> (without lucky rolls)</div></section>`;
  }

  html += `<section><h2>Jokers worth digging for <small>everything the shop can still offer, ranked by how much it raises your chances · ★ = no Gold sticker yet${a.gold && a.gold.this_run_counts ? " (this Gold Stake run can earn it)" : ""}</small></h2>${cand(a.rescue, true)}
    <div class="note">"Per shop" = chance a given shop shows it in one of its joker slots, before rerolls. Buffoon packs are extra chances.</div></section>`;

  html += goldSection(d.gold);
  html += `<footer>Heuristics: ${a.heuristics.map(esc).join(" · ")}<br>Analysed in ${a.elapsed_ms} ms · save written ${a.save_age_secs ?? "?"} s before analysis.</footer>`;
  $("#main").innerHTML = html;
}

function goldSection(g) {
  if (!g) return "";
  const byR = {};
  g.missing.forEach((j) => (byR[j.rarity] ||= []).push(j));
  return `<section><h2>Gold Stake stickers <small>${g.have_gold}/${g.total} · ${g.missing.length} missing</small></h2>` +
    ["Common", "Uncommon", "Rare", "Legendary"].filter((r) => byR[r]).map((r) =>
      `<div style="margin:6px 0"><span class="rar-${r}"><b>${r}</b></span> <span class="muted">${byR[r].map((j) => esc(j.name)).join(", ")}</span></div>`).join("") +
    (g.tally_in_file != null && g.tally_in_file !== g.tally_computed ? `<div class="caveat">Sticker count disagrees with the game's own tally: the profile format may have changed.</div>` : "") +
    `</section>`;
}

let version = -1;
async function poll() {
  try {
    const r = await fetch("/api/analysis", { cache: "no-store" });
    const j = await r.json();
    $("#dot").className = "dot" + (j.busy ? " busy" : "");
    $("#status").textContent = j.busy ? "analysing…" : "live · updates when the game saves";
    if (j.version !== version) { version = j.version; render(j.data); }
  } catch (e) {
    $("#dot").className = "dot busy";
    $("#status").textContent = "advisor not running";
  }
  setTimeout(poll, 800);
}
poll();
</script>
</body>
</html>
