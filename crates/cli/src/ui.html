<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balatro Advisor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='1' width='12' height='14' rx='2' fill='%23e8c547'/></svg>">
<style>
  :root {
    --bg: #11201d; --panel: #1a2e2a; --panel2: #213833; --line: #2f4a44;
    --text: #e9f0ee; --muted: #93aba5; --chips: #3b9cff;
    --good: #37d17a; --warn: #f2b33d; --bad: #ff5c5c; --gold: #e8c547;
    --common: #5fa8ff; --uncommon: #3fce8f; --rare: #ff6b6b; --legendary: #b57bff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 14px; align-items: center; padding: 7px 14px; background: #0c1715; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header .title { font-weight: 800; color: var(--gold); letter-spacing: .5px; }
  header .chip { color: var(--muted); } header .chip b { color: var(--text); }
  .status { margin-left: auto; color: var(--muted); display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .dot.busy { background: var(--warn); animation: pulse 1s infinite; }
  .dot.off { background: #56706a; }
  @keyframes pulse { 50% { opacity: .3 } }
  .caveat { color: #f5dc9b; font-size: 12px; cursor: help; }
  main { padding: 10px 14px 12px; display: grid; gap: 10px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); font-weight: 700; }
  h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
  .rounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .round { background: var(--panel2); border-radius: 8px; padding: 8px 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; }
  .round .pct { grid-row: span 2; font-size: 30px; font-weight: 800; min-width: 80px; }
  .round .name { font-weight: 700; } .round .sub { color: var(--muted); font-size: 12px; }
  .round .bar { grid-column: 1 / -1; margin-top: 4px; }
  .round.done { opacity: .55; }
  .arr { margin: 0 3px; color: var(--muted); font-size: 1.1em; }
  .round .effect { font-weight: 400; font-size: 12px; color: var(--warn); }
  .round .skip { grid-column: 1 / -1; font-size: 12px; margin-top: 3px; padding: 3px 7px; border-radius: 6px; background: #0e1b18; }
  .dig { font-size: 12px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .dig select, .dig input { background: #0e1b18; color: var(--text); border: 1px solid var(--line); border-radius: 5px; font: inherit; }
  .scroll { max-height: 360px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
  .scroll th { position: sticky; top: 0; background: var(--panel); }
  .more { margin-top: 6px; font-size: 12px; } .more a { color: var(--chips); }
  tr.hit td { background: #1a4533; }
  tr.broke td { opacity: .5; }
  tr.hit td:first-child { box-shadow: inset 3px 0 0 var(--good); }
  .dig input[type=range] { width: 110px; accent-color: var(--gold); }
  .bar { height: 6px; background: #0e1b18; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; }
  .cols { display: grid; grid-template-columns: minmax(320px, 5fr) 7fr; gap: 10px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .stack { display: grid; gap: 10px; min-width: 0; }
  .jokers { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 8px; }
  .joker { background: var(--panel2); border-radius: 8px; padding: 8px; border-top: 3px solid var(--common); position: relative; }
  .joker .slot { position: absolute; top: 5px; right: 7px; color: var(--muted); font-size: 11px; }
  .joker .jn { font-weight: 700; padding-right: 14px; }
  .joker .big { font-size: 20px; font-weight: 800; margin-top: 3px; }
  .lbl { font-size: 11px; color: var(--muted); }
  .tags { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 10px; padding: 0 6px; border-radius: 99px; background: #0e1b18; color: var(--muted); border: 1px solid var(--line); }
  .tag.ed { color: #fff; border: none; background: linear-gradient(90deg, #ff6b6b, #f2b33d, #37d17a, #3b9cff, #b57bff); }
  .tag.foil { background: #4a6f9a; color: #fff; border: none; } .tag.holo { background: #b04a6a; color: #fff; border: none; }
  .tag.neg { background: #333; color: #ddd; }
  .tag.hot { color: #0c1715; background: var(--gold); border-color: var(--gold); font-weight: 700; }
  .order { margin-top: 8px; padding: 6px 9px; border-radius: 6px; background: #0e1b18; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 4px 6px; border-bottom: 1px solid #243d37; vertical-align: middle; white-space: nowrap; }
  td.name { white-space: normal; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
  .star { color: var(--gold); font-weight: 700; }
  .rar-Common { color: var(--common); } .rar-Uncommon { color: var(--uncommon); } .rar-Rare { color: var(--rare); } .rar-Legendary { color: var(--legendary); }
  .play { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .card { background: #f4efe4; color: #222; border-radius: 5px; padding: 3px 7px; font-weight: 700; }
  .muted { color: var(--muted); }
  .mix td { padding: 2px 6px; border: none; }
  .outlook td { padding: 3px 6px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details summary b { color: var(--text); }
  footer { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  [title] { cursor: help; }
</style>
</head>
<body>
<header>
  <span class="title">BALATRO ADVISOR</span>
  <span class="chip" id="h-deck"></span>
  <span class="chip" id="h-ante"></span>
  <span class="chip" id="h-money"></span>
  <span class="chip" id="h-screen"></span>
  <span class="caveat" id="h-caveat"></span>
  <span class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
</header>
<main id="main"><div class="empty">Waiting for the first analysis…</div></main>

<script>
const $ = (s) => document.querySelector(s);
const pct = (x) => (x * 100).toFixed(x > 0 && x < 0.1 ? 1 : 0) + "%";
const NOISE = 0.02; // differences below 2 points are within simulation noise
const pp = (d) => Math.abs(d) < NOISE ? '<span class="flat">±0</span>'
  : `<span class="${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${Math.round(d * 100)}</span>`;
const gainTxt = (g) => Math.abs(g) < NOISE ? '<span class="flat">±0%</span>'
  : `<span class="${g > 0 ? "up" : "down"}">${g > 0 ? "+" : ""}${Math.round(g * 100)}%</span>`;
const color = (p) => p >= 0.85 ? "var(--good)" : p >= 0.5 ? "var(--warn)" : "var(--bad)";
const num = (x) => x >= 1e6 ? x.toExponential(2) : Math.round(x).toLocaleString("en-US");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rarColor = { Common: "var(--common)", Uncommon: "var(--uncommon)", Rare: "var(--rare)", Legendary: "var(--legendary)" };
const edTag = (e) => !e ? "" : e === "polychrome" ? '<span class="tag ed">poly</span>' : e === "foil" ? '<span class="tag foil">foil</span>' : e === "holo" ? '<span class="tag holo">holo</span>' : '<span class="tag neg">negative</span>';
const roundName = (r) => r.label === "Boss" ? r.blind : r.label.replace("Next: ", "");
const nowRounds = (a) => a.rounds.filter((r) => !r.horizon);
const STAKES = ["", "White", "Red", "Green", "Black", "Blue", "Purple", "Orange", "Gold"];

// Style tags: which play style a joker belongs to; highlighted when that style is among
// the outlook's top 2 (it builds toward a combo with room to grow). No tag = generic booster.
function styleTags(a, key) {
  const top = (a.outlook ? a.outlook.styles.slice(0, 2) : []).map((s) => s.name);
  return (a.style_groups || []).filter(([, keys]) => keys.includes(key)).map(([name]) => {
    const hot = top.includes(name);
    return ` <span class="tag${hot ? " hot" : ""}" title="${hot ? "Builds toward one of your best styles in the outlook" : "Belongs to this style"}">${esc(name)}</span>`;
  }).join("");
}

function candTable(a, list, withFind, odds) {
  return `<table><tr><th>Joker</th><th>Action</th><th class="num">$</th>${a.rounds.map((r) => `<th class="num" ${r.horizon ? 'title="Share of that boss target reached (win chance is ~0 this far out)"' : ""}>${esc(r.horizon ? r.label + " reach" : roundName(r))}</th>`).join("")}<th class="num" title="Change in the best hand you can make from a fresh deal">Hand</th>${withFind ? '<th class="num" title="Chance a given shop shows it, before rerolls">Shop</th>' : ""}</tr>` +
    list.map((c) => `<tr${odds && (c.p_win[odds.round] ?? 0) >= odds.t ? ' class="hit"' : ""}>
      <td class="name" ${c.desc || c.note ? `title="${esc([c.desc, c.note].filter(Boolean).join("\n"))}"` : ""}><span class="rar-${c.rarity}">●</span> <b>${esc(c.name)}</b>${c.precise === false ? ' <span class="muted" title="Quicker, rougher estimate">~</span>' : ""}${styleTags(a, c.key)} ${edTag(c.edition)}${c.missing_gold ? ' <span class="star" title="No Gold sticker yet">★</span>' : ""}</td>
      <td class="muted">${esc(c.action.replace("replace ", "sell "))}</td>
      <td class="num">${c.cost}</td>
      ${c.p_win.map((p, i) => { if (a.rounds[i].horizon) { const r = Math.min(c.reach[i], 9), was = Math.min(c.reach[i] - c.reach_delta[i], 9);
          return `<td class="num" title="Share of the ${esc(a.rounds[i].label)} boss target you reach on average: now ${pct(was)}, with it ${pct(r)}"><span class="muted">${pct(was)}</span><span class="arr">→</span><span class="${c.reach_delta[i] > NOISE ? "up" : c.reach_delta[i] < -NOISE ? "down" : "flat"}">${pct(r)}</span></td>`; }
        const was = p - c.p_win_delta[i], d = c.p_win_delta[i];
        const cls = Math.abs(d) < NOISE ? "flat" : d > 0 ? "up" : "down";
        return `<td class="num" title="now ${pct(was)}, with it ${pct(p)}"><span class="muted">${pct(was)}</span><span class="arr">→</span><span class="${cls}">${pct(p)}</span></td>`; }).join("")}
      <td class="num">${gainTxt(c.score_gain)}</td>
      ${withFind ? `<td class="num muted">${c.per_shop != null ? pct(c.per_shop) : ""}</td>` : ""}
    </tr>`).join("") + `</table>`;
}

// One table of every pool joker, sorted by the chance to beat the round picked in the dig line.
function digTable(a, odds) {
  const r = odds.round;
  const sorted = [...a.pool].sort((x, y) => (y.p_win[r] ?? 0) - (x.p_win[r] ?? 0) || y.score_gain - x.score_gain);
  const open = localStorage.getItem("allOpen") === "1";
  const rows = open ? sorted : sorted.slice(0, 9);
  const more = `<div class="more"><a href="#" onclick="try{localStorage.setItem('allOpen','${open ? "0" : "1"}')}catch(e){};render(last);return false">${open ? "show fewer" : `show all ${sorted.length}`}</a> <span class="muted">· rows marked ~ use a quicker, rougher estimate</span></div>`;
  return `<div class="${open ? "scroll" : ""}">${candTable(a, rows, true, odds)}</div>${more}`;
}

// The game's suit colours (globals.lua G.C.SO_1 / SO_2 for "high contrast cards").
let highContrast = true;
function suitColour(label) {
  const pal = highContrast
    ? { "♥": "#f83b2f", "♦": "#e29000", "♠": "#4f31b9", "♣": "#008ee6" }
    : { "♥": "#f03464", "♦": "#f06b3f", "♠": "#403995", "♣": "#235955" };
  const sym = [...label].find((ch) => pal[ch]);
  return sym ? pal[sym] : "#222";
}

function rescueOdds(a) {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("dig") || "{}"); } catch (e) {}
  const nowIdx = a.rounds.map((r, i) => r.horizon ? -1 : i).filter((i) => i >= 0);
  const boss = a.rounds.findIndex((r) => r.label === "Boss");
  const round = nowIdx.includes(saved.round) ? saved.round : (boss >= 0 ? boss : nowIdx[nowIdx.length - 1] ?? 0);
  const t = saved.t ?? 0.7;
  const so = a.shop_odds;
  const good = a.pool.filter((p) => (p.p_win[round] ?? 0) >= t);
  const g = [0, 1, 2, 3].map((r) => so.pool_by_rarity[r] ? good.filter((p) => p.rarity_n === r).length / so.pool_by_rarity[r] : 0);
  const perJoker = [1, 2, 3].reduce((s, r) => s + so.rarity_weight[r] * g[r], 0);
  const perCard = so.joker_share * perJoker;
  return {
    round, t, good, g,
    shop: (k) => 1 - Math.pow(1 - perCard, so.slots * (k + 1)),
    rerollCost: (k) => Array.from({ length: k }, (_, i) => so.reroll_cost + i).reduce((s, x) => s + x, 0),
    buffoon: (n) => 1 - Math.pow(1 - perJoker, n),
  };
}

// What a skip tag is worth, in the same currency as the dig panel where it is about jokers.
function tagInfo(tag, a, o) {
  const name = roundName(a.rounds[o.round]), at = Math.round(o.t * 100) + "%";
  const good = (p) => `<b>${pct(p)}</b> chance of a joker that gets ${esc(name)} to ${at}`;
  switch (tag.key) {
    case "tag_rare": return { text: "free Rare joker in the next shop · " + good(o.g[3]), why: "Chance the free Rare is one of the jokers that reach your target" };
    case "tag_uncommon": return { text: "free Uncommon joker in the next shop · " + good(o.g[2]), why: "Chance the free Uncommon is one of the jokers that reach your target" };
    case "tag_buffoon": return { text: "Mega Buffoon pack (4 jokers, pick 2) · " + good(o.buffoon(4)), why: "Chance at least one of the 4 reaches your target" };
    case "tag_top_up": return { text: "2 free Common jokers · " + good(1 - Math.pow(1 - o.g[1], 2)), why: "Needs free joker slots" };
    case "tag_polychrome": return { text: "next shop joker becomes Polychrome (×1.5 mult) and free", why: "Value depends on which joker the next shop shows" };
    case "tag_holo": return { text: "next shop joker becomes Holographic (+10 mult) and free", why: "" };
    case "tag_foil": return { text: "next shop joker becomes Foil (+50 chips) and free", why: "" };
    case "tag_negative": return { text: "next shop joker becomes Negative (+1 slot) and free", why: "" };
    case "tag_economy": return { text: `doubles your money (max +$40): +$${Math.min(40, Math.max(0, a.dollars))} now`, why: "Applied immediately on skip" };
    case "tag_investment": return { text: "+$25 after the next boss", why: "" };
    case "tag_d_six": return { text: "rerolls start at $0 in the next shop", why: "" };
    case "tag_coupon": return { text: "next shop's cards and packs are free", why: "" };
    case "tag_juggle": return { text: "+3 hand size next round", why: "" };
    case "tag_orbital": return { text: "+3 levels to a random poker hand", why: "" };
    case "tag_double": return { text: "copies the next tag you take", why: "" };
    case "tag_boss": return { text: "rerolls the boss blind", why: "" };
    case "tag_voucher": return { text: "adds a voucher to the next shop", why: "" };
    case "tag_handy": return { text: `+$1 per hand played this run`, why: "" };
    case "tag_garbage": return { text: `+$1 per unused discard this run`, why: "" };
    case "tag_skip": return { text: `+$5 per blind skipped this run`, why: "" };
    case "tag_charm": return { text: "free Mega Arcana pack", why: "" };
    case "tag_meteor": return { text: "free Mega Celestial pack", why: "" };
    case "tag_ethereal": return { text: "free Spectral pack", why: "" };
    case "tag_standard": return { text: "free Mega Standard pack", why: "" };
    default: return { text: "", why: "" };
  }
}

let last = null;
function render(d) {
  last = d;
  if (d.status === "no_run") {
    $("#main").innerHTML = `<section><div class="empty">No run in progress (${esc(d.message)}).<br>Start or continue a run and this updates by itself.</div></section>` + goldSection(d.gold);
    return;
  }
  if (d.status !== "ok") return;
  const a = d.analysis;
  $("#h-deck").innerHTML = `<b>${esc(a.deck)}</b>`;
  $("#h-ante").innerHTML = `Ante <b>${a.ante}</b> · <b>${STAKES[a.stake] || a.stake}</b>`;
  $("#h-money").innerHTML = `<b>$${a.dollars}</b>`;
  $("#h-screen").innerHTML = esc(a.screen.replace(/([a-z])([A-Z])/g, "$1 $2"));
  $("#h-caveat").innerHTML = a.caveats.length && !a.live ? "⚠ snapshot" : "";
  $("#h-caveat").title = a.caveats.join("\n");

  // Top: the ante's three blinds, their rewards and skip tags
  const odds = rescueOdds(a);
  const hz = a.rounds.find((r) => r.horizon);
  let html = `<section style="padding:8px"><div class="rounds">` + a.blinds.map((bl) => {
    const done = bl.p_win == null;
    const p = bl.p_win ?? 0;
    const round = a.rounds.find((r) => !r.horizon && (r.label === "Boss" ? bl.slot === "Boss" : r.label.endsWith(bl.slot)));
    const tag = bl.skip_tag ? tagInfo(bl.skip_tag, a, odds) : null;
    return `<div class="round${done ? " done" : ""}" ${round && round.unmodelled ? `title="${esc(round.unmodelled)}"` : ""}>
      <div class="pct" style="color:${done ? "var(--muted)" : color(p)}">${done ? (bl.state === "Skipped" ? "skip" : "✓") : pct(p)}</div>
      <div class="name">${esc(bl.slot)}${bl.slot === "Boss" ? " · " + esc(bl.name) : ""}${round && round.unmodelled ? ' <span class="caveat">⚠</span>' : ""}${bl.effect ? `<div class="effect">${esc(bl.effect)}</div>` : ""}</div>
      <div class="sub">${bl.state === "Current" ? "<b>in progress</b>, from your hand and draw pile · " : ""}${num(bl.target)} chips · reward ${bl.reward ? "$" + bl.reward : "none"} + $${a.shop_odds.money_per_hand}/hand left + interest</div>
      ${tag && !done ? `<div class="skip" title="${esc(tag.why)}">Skip → <b>${esc(bl.skip_tag.name)}</b>: ${tag.text}</div>` : ""}
      ${!done ? `<div class="bar"><i style="width:${p * 100}%;background:${color(p)}"></i></div>` : ""}
    </div>`;
  }).join("") + `</div>` +
    (hz ? `<div class="lbl" style="margin-top:6px" title="Your current jokers against a plain boss next ante: how far this board carries without new jokers">Next ante with these jokers: ${esc(hz.label)} boss needs ${num(hz.target)}, you reach <b style="color:${color(hz.reach)}">${pct(Math.min(hz.reach, 1))}</b> of it on average</div>` : "") +
    `</section>`;

  // Left: jokers, hand mix, best play
  let left = `<section><h2>Your jokers ${a.jokers.length}/${a.joker_slots} <small>share of best-hand score · win chance now → without it</small></h2>`;
  if (!a.jokers.length) left += `<div class="muted">No jokers yet.</div>`;
  else {
    left += `<div class="jokers">` + a.jokers.map((j, i) => {
      const scoring = j.roles.some((r) => ["scoring", "retrigger", "rule"].includes(r)) || Math.abs(j.score_share) > 0.005;
      // Win chance now → without this joker, per round of this ante
      const sold = j.p_win_if_removed.map((d, k) => {
        const r = a.rounds[k];
        if (r.horizon) return "";
        const cls = Math.abs(d) < NOISE ? "flat" : d < 0 ? "down" : "up";
        return `${esc(roundName(r))} <span class="muted">${pct(r.p_win)}</span><span class="arr">→</span><span class="${cls}">${pct(Math.max(0, r.p_win + d))}</span>`;
      }).filter(Boolean).join(" · ");
      return `<div class="joker" style="border-top-color:${rarColor[j.rarity] || "var(--line)"}" ${j.desc || j.note ? `title="${esc([j.desc, j.note].filter(Boolean).join("\n"))}"` : ""}>
        <span class="slot">${i + 1}</span>
        <div class="jn">${esc(j.name)}</div>
        <div class="tags">${edTag(j.edition)}${j.roles.map((r) => `<span class="tag">${r}</span>`).join("")}${j.eternal ? '<span class="tag">eternal</span>' : ""}${j.perishable != null ? `<span class="tag" style="color:var(--warn)" title="Debuffed after this many more rounds">perishable ${j.perishable}</span>` : ""}${j.rental ? '<span class="tag" style="color:var(--warn)" title="Costs $3 at the end of every round">rental $3</span>' : ""}${j.debuff ? '<span class="tag" style="color:var(--bad)">debuffed</span>' : ""}</div>
        ${scoring ? `<div class="big">${Math.round(j.score_share * 100)}%</div>` : `<div class="big muted" title="No direct score">—</div>`}
        <div class="lbl">without it: ${sold}</div>
      </div>`;
    }).join("") + `</div>`;
    if (a.order && !a.order.is_current) {
      left += `<div class="order">Better order: <b>${a.order.order.map(esc).join(" → ")}</b> <span class="up">+${Math.round(a.order.gain * 100)}%</span></div>`;
    } else if (a.order) {
      left += `<div class="order muted"><span class="up">✓</span> Order is already the best found.</div>`;
    }
  }
  if (a.hand_mix && a.hand_mix.length) {
    left += `<div style="margin-top:8px"><div class="lbl" title="From simulated ${esc(roundName(nowRounds(a)[nowRounds(a).length - 1]))} rounds; junk hands played to dig are left out">Hands that score your points</div><table class="mix">` +
      a.hand_mix.slice(0, 4).map((h) => `<tr><td>${esc(h.hand)}</td><td class="num" style="width:44px">${pct(h.share)}</td><td style="width:38%"><div class="bar"><i style="width:${h.share * 100}%;background:var(--chips)"></i></div></td><td class="num muted">avg ${num(h.mean)}</td></tr>`).join("") + `</table></div>`;
  }
  left += `</section>`;
  if (a.outlook && a.outlook.styles.length) {
    const o = a.outlook;
    const openAll = localStorage.getItem("styleAll") === "1";
    const rows = openAll ? o.styles : o.styles.slice(0, 4);
    left += `<section><h2>Style outlook <small>your board + the 2 best jokers each style could add · share of the ${esc(o.target_label)} (${num(o.target)}) reached · estimate</small></h2><table class="outlook">` +
      rows.map((st) => {
        const adds = st.add.map(([n, p, c]) => `<span title="${pct(p)} of shops show it · $${c}">${esc(n)}</span>`).join(" + ");
        return `<tr>
        <td class="name"><b>${esc(st.name)}</b>${st.points_now > 0.005 ? ` <span class="muted">· ${pct(st.points_now)} of your points</span>` : ""}
          <div class="lbl">+ ${adds}${st.replaces.length ? ` <span title="Sold to make room">(sell ${st.replaces.map(esc).join(", ")})</span>` : ""}</div></td>
        <td class="num" style="width:96px"><span class="muted">${pct(o.now_reach)}</span><span class="arr">→</span><b style="color:${color(Math.min(st.reach, 1))}">${pct(st.reach)}</b></td>
      </tr>`;
      }).join("") + `</table><div class="more"><a href="#" onclick="try{localStorage.setItem('styleAll','${openAll ? "0" : "1"}')}catch(e){};render(last);return false">${openAll ? "show fewer" : `all ${o.styles.length} styles`}</a> <span class="muted">· hover a joker for its shop odds</span></div></section>`;
  }
  if (a.best_play) {
    left += `<section><h2>Best play now</h2><div class="play">${a.best_play.cards.map((c) => `<span class="card" style="color:${suitColour(c)}">${esc(c)}</span>`).join("")}<span style="margin-left:6px"><b>${esc(a.best_play.hand)}</b> · ${num(a.best_play.score)}</span></div></section>`;
  }

  // Right: shop, dig list
  let right = "";
  if (a.options && a.options.length) {
    const r = a.rounds[a.options_round];
    right += `<section><h2>Your options vs ${esc(roundName(r))} <small>win chance after each, now ${pct(r.p_win)} · packs and rerolls are averages over what they can show</small></h2><table>` +
      a.options.map((o) => `<tr${o.unaffordable ? ' class="broke" title="You can\'t afford this right now"' : ""}><td class="name"><b>${esc(o.label)}</b>${o.unaffordable ? ' <span class="down">can\'t afford</span>' : ""} <span class="muted">${esc(o.note)}</span></td><td class="num">$${o.cost}</td>
        <td class="num" title="Money left, and the interest it earns per round ($1 per $5, before payouts)"><span class="${o.interest_after < o.interest_now ? "down" : "muted"}">$${Math.round(o.money_after)} · int $${o.interest_after}${o.interest_after < o.interest_now ? ` (−$${o.interest_now - o.interest_after})` : ""}</span></td>
        <td class="num"><span class="muted">${pct(r.p_win)}</span><span class="arr">→</span><span class="${o.p_win > r.p_win + NOISE ? "up" : "flat"}">${pct(o.p_win)}</span></td></tr>`).join("") + `</table></section>`;
  }
  if (a.shop.length) right += `<section><h2>Shop jokers <small>win chance now → with it</small></h2>${candTable(a, a.shop, false)}</section>`;
  const roundOpts = a.rounds.map((r, i) => r.horizon ? "" : `<option value="${i}" ${i === odds.round ? "selected" : ""}>${esc(roundName(r))}</option>`).join("");
  right += `<section><h2>Worth digging for <small>win chance now → with it · still in the shop pool · ★ no Gold sticker${a.gold && a.gold.this_run_counts ? " (this run can earn it)" : ""}</small></h2>
    <div class="dig">I need <select id="dig-round">${roundOpts}</select> at <input id="dig-t" type="range" min="30" max="100" step="5" value="${Math.round(odds.t * 100)}"> <b>${Math.round(odds.t * 100)}%</b> ·
      <span title="${odds.good.map((g) => esc(g.name)).join(", ")}"><b>${odds.good.length}</b> jokers get you there</span> ·
      ${a.screen === "Shop"
        ? `chance to see one: ${[1, 2, 3].filter((k) => odds.rerollCost(k) <= a.dollars).map((k) => `${k} reroll${k > 1 ? "s" : ""} ($${odds.rerollCost(k)}) <b>${pct(odds.shop(k - 1))}</b>`).join(" · ")} <span class="muted" title="A reroll redraws only the card slots, not packs or vouchers">(each redraws ${a.shop_odds.slots} cards)</span>`
        : `chance to see one in the shop after this blind: <b>${pct(odds.shop(0))}</b> · +1 reroll <b>${pct(odds.shop(1))}</b> · +3 rerolls <b>${pct(odds.shop(3))}</b>`}</div>
    ${digTable(a, odds)}</section>`;

  html += `<div class="cols"><div class="stack">${left}</div><div class="stack">${right}</div></div>`;
  html += goldSection(d.gold);
  html += `<footer title="${esc(a.heuristics.join("\n"))}">Heuristic play/discard policy · analysed in ${a.elapsed_ms} ms · save ${a.save_age_secs ?? "?"} s old</footer>`;
  $("#main").innerHTML = html;
}

function goldSection(g) {
  if (!g) return "";
  const byR = {};
  g.missing.forEach((j) => (byR[j.rarity] ||= []).push(j));
  const open = localStorage.getItem("goldOpen") === "1" ? " open" : "";
  return `<section style="padding:7px 12px"><details${open} ontoggle="try{localStorage.setItem('goldOpen', this.open ? '1' : '0')}catch(e){}"><summary>Gold Stake stickers <b>${g.have_gold}/${g.total}</b> · ${g.missing.length} missing${g.tally_in_file != null && g.tally_in_file !== g.tally_computed ? ' · <span class="down">tally mismatch, format may have changed</span>' : ""}</summary>` +
    ["Common", "Uncommon", "Rare", "Legendary"].filter((r) => byR[r]).map((r) =>
      `<div style="margin:4px 0"><span class="rar-${r}"><b>${r}</b></span> <span class="muted">${byR[r].map((j) => esc(j.name)).join(", ")}</span></div>`).join("") +
    `</details></section>`;
}

document.addEventListener("input", (e) => {
  if (e.target.id !== "dig-t" && e.target.id !== "dig-round") return;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("dig") || "{}"); } catch (err) {}
  if (e.target.id === "dig-t") saved.t = Number(e.target.value) / 100;
  if (e.target.id === "dig-round") saved.round = Number(e.target.value);
  try { localStorage.setItem("dig", JSON.stringify(saved)); } catch (err) {}
  if (last) render(last);
});

let version = -1;
async function poll() {
  try {
    const r = await fetch("/api/analysis", { cache: "no-store" });
    const j = await r.json();
    const seen = j.game_seen_secs;
    const gameUp = seen != null && seen < 6;
    $("#dot").className = "dot" + (j.busy ? " busy" : gameUp ? "" : " off");
    $("#status").textContent = j.busy ? "analysing…"
      : gameUp ? "live from the game"
      : seen != null ? `game not running (last seen ${seen < 120 ? seen + " s" : Math.round(seen / 60) + " min"} ago)`
      : "reading checkpoint saves (live mod not active)";
    const hc = j.high_contrast !== false;
    if (j.version !== version || hc !== highContrast) { version = j.version; highContrast = hc; render(j.data); }
  } catch (e) {
    $("#dot").className = "dot busy";
    $("#status").textContent = "advisor not running";
  }
  setTimeout(poll, 800);
}
poll();
</script>
</body>
</html>
