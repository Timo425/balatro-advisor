[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tests run whole analyses: build them optimised so `cargo test` stays quick.
[profile.test]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
